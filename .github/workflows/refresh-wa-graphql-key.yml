name: Refresh World Athletics GraphQL credentials

# Keeps functions/_shared/wa-graphql.js supplied with a working, current x-api-key by running the
# same "watch a real browser's own network traffic" capture worldathletics.nimarion.de's own
# maintainer runs for himself - see scripts/wa-key-refresh.mjs for why this exists at all (that
# third-party service going down for 24+ hours with no ETA is what prompted building this).
# Playwright and its Chromium build are installed fresh on the runner each time. This workflow
# never runs `git add`/`commit`/`push`, so nothing it installs or writes ever reaches the actual
# git history - it can't affect the site's own, separately-triggered Cloudflare Pages build/deploy
# even though the install happens at the checkout root (needed so plain ESM `import 'playwright'`
# in the script below can find it via Node's normal upward node_modules resolution - NODE_PATH,
# tried first, is a CommonJS-only mechanism that ESM's resolver ignores entirely).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright (never committed - checkout is discarded after this job)
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Capture fresh credentials and store in Cloudflare KV
        run: node scripts/wa-key-refresh.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
